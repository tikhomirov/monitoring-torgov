database:
  path: data/land_monitor.sqlite3

exports:
  path: data/land_items.xlsx

http:
  timeout_seconds: 30
  user_agent: LandMonitor/0.1 (+local)

sources:
  gis_torgi:
    enabled: true
    excel_url: ""
  vbglenobl:
    enabled: true
    list_url: ""

filters:
  min_area_m2: 1000
  stations:
    - Каннельярви
    - Кирилловское
    - Гаврилово
    - Рощино
    - Победа
    - Горьковское
    - Приветнинское
    - Ландышевка
    - Межозерное
  positive_keywords:
    - земельный участок
    - индивидуального жилищного строительства
    - ИЖС
    - личного подсобного хозяйства
    - ЛПХ
    - садоводство
    - договор аренды
    - право заключения договора аренды
    - намерении участвовать
    - ст. 39.18
    - "39.18"
    - аукцион
  strong_keywords:
    - ИЖС
    - ЛПХ
    - садоводство
    - ст. 39.18
    - "39.18"
  negative_keywords:
    - нежилое здание
    - помещение
    - гараж
    - коммерческое
    - сельскохозяйственное производство
    - земельные участки общего назначения
